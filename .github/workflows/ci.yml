name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CI: "true"

jobs:
  native:
    name: native (${{ matrix.id }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-gnu
            os: ubuntu-latest
          - id: macos
            os: macos-latest
          - id: windows-gnu
            os: windows-latest
            windows: true
    steps:
      - uses: actions/checkout@v4

      - name: Install deps (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Install deps (Windows)
        if: matrix.windows
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            mingw-w64-x86_64-toolchain

      - name: Build artifact + smoke (glibc / macOS)
        if: ${{ !matrix.windows }}
        run: make smoke

      - name: Build artifact + smoke (Windows gnu)
        if: matrix.windows
        shell: msys2 {0}
        run: |
          export PATH="$MINGW_PREFIX/bin:/usr/bin:$PATH"
          make smoke

  test:
    name: coil test (ubuntu)
    runs-on: ubuntu-latest
    needs: native
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: ardax-corp/coil-lang
          path: coil-lang

      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y libffi-dev build-essential

      - uses: dtolnay/rust-toolchain@stable

      - name: Build coil
        run: cargo build --bin coil
        working-directory: coil-lang

      - name: Build native artifact
        run: make

      - name: Test
        run: make test
        env:
          COIL: ${{ github.workspace }}/coil-lang/target/debug/coil
