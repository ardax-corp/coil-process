name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

# A new push to a pull request cancels that PR's older runs. Runs on the
# default branch are never cancelled once started.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CI: "true"

jobs:
  native:
    name: native (${{ matrix.id }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-gnu
            triple: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - id: macos
            triple: aarch64-apple-darwin
            os: macos-latest
          - id: windows-gnu
            triple: x86_64-pc-windows-gnu
            os: windows-latest
            windows: true
    steps:
      - uses: actions/checkout@v4

      - name: Install deps (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Install deps (Windows)
        if: matrix.windows
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            mingw-w64-x86_64-toolchain

      - name: Build artifact + smoke (glibc / macOS)
        if: ${{ !matrix.windows }}
        run: make smoke

      - name: Build artifact + smoke (Windows gnu)
        if: matrix.windows
        shell: msys2 {0}
        run: |
          export PATH="$MINGW_PREFIX/bin:/usr/bin:$PATH"
          make smoke

      # The library this cell built, as the edge / release asset for its
      # triple (the `publish` job below).
      - name: Package native library
        shell: bash
        run: |
          set -euo pipefail
          lib=""
          for f in native/libprocess.so native/libprocess.dylib native/libprocess.dll; do
            if [ -f "$f" ]; then lib="$f"; fi
          done
          test -n "$lib"
          mkdir -p dist/pkg/native
          cp "$lib" dist/pkg/native/
          tar -C dist/pkg -czf "dist/coil-process-native-${{ matrix.triple }}.tar.gz" native
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.triple }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  test:
    name: coil test (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y build-essential

      # coil comes from the coil-lang `edge` release (a snapshot of its main,
      # rebuilt after every green coil-lang CI run) instead of a source build.
      - name: Install coil (edge)
        id: coil
        uses: ardax-corp/coil-lang/.github/actions/setup-coil@main
        with:
          stdlib: true

      - name: Build native artifact
        run: make

      - name: Test
        run: make test COIL_ROOTS='--root ${{ steps.coil.outputs.stdlib }}'

  # The native library of every target above, once all of CI is green: a
  # push to main replaces the rolling `edge` pre-release, a v* tag gets a
  # release of its own. Each archive unpacks `native/libprocess.*` into a
  # coil-process checkout; SHA256SUMS also lists each library for `--dload-pin`.
  publish:
    name: publish (${{ github.ref_type == 'tag' && github.ref_name || 'edge' }})
    needs: [native, test]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum -- *.tar.gz > SHA256SUMS
          for a in *.tar.gz; do
            d="$(mktemp -d)"
            tar -C "$d" -xzf "$a"
            (cd "$d" && sha256sum native/*) | sed "s|  native/|  ${a%.tar.gz}/|" >> SHA256SUMS
          done
          cat SHA256SUMS

      - name: Update the edge release
        if: github.ref == 'refs/heads/main'
        run: |
          git tag -f edge "$GITHUB_SHA"
          git push -f origin refs/tags/edge
          notes="Rolling pre-release of the coil-process native library, rebuilt from main after every green CI run.

          Commit: ${GITHUB_SHA}
          Built: $(date -u '+%Y-%m-%d %H:%M UTC')

          Not a stable release: the archives and this tag are replaced on every build.
          \`coil-process-native-<triple>.tar.gz\` holds \`native/libprocess.*\` (unpack it in the package root); \`SHA256SUMS\` lists the archives and the libraries (for \`--dload-pin\`)."
          if gh release view edge >/dev/null 2>&1; then
            gh release edit edge --prerelease --title "edge" --notes "$notes"
          else
            gh release create edge --prerelease --verify-tag --title "edge" --notes "$notes"
          fi
          gh release upload edge dist/*.tar.gz dist/SHA256SUMS --clobber
          # Drop assets this build did not produce (e.g. a removed target).
          gh release view edge --json assets -q '.assets[].name' | while read -r name; do
            if [[ ! -e "dist/$name" ]]; then
              gh release delete-asset edge "$name" --yes
            fi
          done

      - name: Publish the tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="$GITHUB_REF_NAME"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --verify-tag --title "$tag" \
              --notes "coil-process $tag: \`coil-process-native-<triple>.tar.gz\` holds \`native/libprocess.*\` (unpack it in the package root); \`SHA256SUMS\` lists the archives and the libraries (for \`--dload-pin\`)."
          fi
          gh release upload "$tag" dist/*.tar.gz dist/SHA256SUMS --clobber
